<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Tile Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .wrap {
      width: 100%;
      max-width: 500px;
    }

    /* ── Brand strip ── */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand-tag {
      font-size: 12px;
      color: #f5a623;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Card ── */
    .card {
      background: #1c1c1e;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #2a2a2c;
    }

    /* ── Section header ── */
    .section-head {
      padding: 28px 28px 0;
    }

    .section-head h2 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .section-head p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* ── Mode pills ── */
    .mode-pills {
      display: flex;
      gap: 8px;
      padding: 20px 28px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mode-pills::-webkit-scrollbar { display: none; }

    .pill {
      flex-shrink: 0;
      background: #2a2a2c;
      color: #aaa;
      border: none;
      border-radius: 40px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .pill.active {
      background: #f5a623;
      color: #111;
    }

    /* ── Sliders ── */
    .sliders {
      padding: 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .slider-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .slider-meta .s-label {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .slider-meta .s-val {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .slider-meta .s-unit {
      font-size: 14px;
      font-weight: 500;
      color: #666;
      margin-left: 2px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: #333;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f5a623;
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.2);
      transition: box-shadow 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 7px rgba(245, 166, 35, 0.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: #f5a623;
      cursor: pointer;
    }

    .slider-limits {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .slider-limits span {
      font-size: 11px;
      color: #555;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #2a2a2c;
      margin: 0 28px;
    }

    /* ── Results ── */
    .results {
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .result-tile {
      background: #111;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid #2a2a2c;
    }

    .result-tile.highlight {
      background: #f5a623;
      border-color: #f5a623;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .result-tile.cost {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }

    .result-tile .r-label {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .result-tile.highlight .r-label {
      color: rgba(0,0,0,0.5);
      margin-bottom: 0;
    }

    .result-tile.cost .r-label {
      margin-bottom: 0;
    }

    .result-tile .r-val {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .result-tile.highlight .r-val {
      font-size: 40px;
      color: #111;
    }

    .result-tile.cost .r-val {
      font-size: 28px;
      color: #f5a623;
    }

    .result-tile .r-sub {
      font-size: 11px;
      color: #555;
      margin-top: 3px;
    }

    /* ── CTA ── */
    .cta-wrap {
      padding: 0 28px 28px;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #f5a623;
      color: #111;
      font-size: 15px;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.15s;
    }

    .cta-btn:hover { opacity: 0.88; }

    .cta-note {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <div class="brand-name">Garage Pro</div>
    <div class="brand-tag">Tile Calculator</div>
  </div>

  <div class="card">

    <div class="section-head">
      <h2>How much do you need?</h2>
      <p>Select a method below to get started.</p>
    </div>

    <!-- Mode selector -->
    <div class="mode-pills">
      <button class="pill active" data-mode="dimensions">Length &amp; Width</button>
      <button class="pill" data-mode="sqm">Square Metres</button>
      <button class="pill" data-mode="tiles">Tile Count</button>
    </div>

    <!-- Sliders -->
    <div class="sliders" id="sliders"></div>

    <div class="divider"></div>

    <!-- Results -->
    <div class="results">
      <div class="result-tile highlight">
        <div class="r-label">Tiles Needed</div>
        <div class="r-val" id="out-tiles">225</div>
      </div>
      <div class="result-tile">
        <div class="r-label">Coverage</div>
        <div class="r-val" id="out-coverage">36.0 sqm</div>
        <div class="r-sub">0.4m × 0.4m per tile</div>
      </div>
      <div class="result-tile">
        <div class="r-label">At $5 per tile</div>
        <div class="r-val" id="out-price">$1,125</div>
        <div class="r-sub">estimate only</div>
      </div>
      <div class="result-tile cost">
        <div class="r-label">Standard double garage</div>
        <div class="r-val">From $1,099</div>
      </div>
    </div>

    <div class="divider" style="margin-bottom: 24px;"></div>

    <!-- CTA -->
    <div class="cta-wrap">
      <button class="cta-btn">
        Get a Free Quote &nbsp;→
      </button>
      <p class="cta-note">Prices are estimates only — contact us for an exact quote.</p>
    </div>

  </div>
</div>

<script>
  const TILE_SQM    = 0.16;   // 0.4m × 0.4m
  const PRICE_TILE  = 5;      // $5 per tile

  const MODES = {
    dimensions: [
      { id: 'length', label: 'Length', min: 0.4, max: 50, step: 0.2, default: 6,   unit: 'm' },
      { id: 'width',  label: 'Width',  min: 0.4, max: 50, step: 0.2, default: 6,   unit: 'm' },
    ],
    sqm: [
      { id: 'sqm', label: 'Area', min: 1, max: 500, step: 1, default: 36, unit: 'sqm' },
    ],
    tiles: [
      { id: 'tiles', label: 'Tiles', min: 1, max: 800, step: 1, default: 225, unit: 'tiles' },
    ],
  };

  let currentMode = 'dimensions';

  function buildSliders(mode) {
    const el = document.getElementById('sliders');
    el.innerHTML = '';
    MODES[mode].forEach(s => {
      el.innerHTML += `
        <div class="slider-block">
          <div class="slider-meta">
            <span class="s-label">${s.label}</span>
            <span>
              <span class="s-val" id="val-${s.id}">${s.default}</span>
              <span class="s-unit">${s.unit}</span>
            </span>
          </div>
          <input type="range" id="slider-${s.id}"
            min="${s.min}" max="${s.max}" step="${s.step}" value="${s.default}"
            oninput="onSlider('${s.id}')" />
          <div class="slider-limits">
            <span>${s.min} ${s.unit}</span>
            <span>${s.max} ${s.unit}</span>
          </div>
        </div>`;
    });
    MODES[mode].forEach(s => updateTrack(`slider-${s.id}`));
  }

  function updateTrack(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
    el.style.background =
      `linear-gradient(to right, #f5a623 0%, #f5a623 ${pct}%, #333 ${pct}%)`;
  }

  function onSlider(id) {
    const el  = document.getElementById(`slider-${id}`);
    const val = parseFloat(el.value);
    document.getElementById(`val-${id}`).textContent =
      Number.isInteger(val) ? val : val.toFixed(1);
    updateTrack(`slider-${id}`);
    calculate();
  }

  function calculate() {
    let tiles;

    if (currentMode === 'dimensions') {
      const l = parseFloat(document.getElementById('slider-length').value);
      const w = parseFloat(document.getElementById('slider-width').value);
      tiles = Math.ceil((l * w) / TILE_SQM);
    } else if (currentMode === 'sqm') {
      const sqm = parseFloat(document.getElementById('slider-sqm').value);
      tiles = Math.ceil(sqm / TILE_SQM);
    } else {
      tiles = parseInt(document.getElementById('slider-tiles').value);
    }

    const coverage = (tiles * TILE_SQM).toFixed(1);
    const price    = tiles * PRICE_TILE;

    document.getElementById('out-tiles').textContent    = tiles.toLocaleString();
    document.getElementById('out-coverage').textContent = coverage + ' sqm';
    document.getElementById('out-price').textContent    =
      '$' + price.toLocaleString('en-AU', { maximumFractionDigits: 0 });
  }

  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      buildSliders(currentMode);
      calculate();
    });
  });

  buildSliders(currentMode);
  calculate();
</script>
</body>
</html>
