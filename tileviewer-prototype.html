<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tile Viewer — Garage Pro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;
  --bg2:#131313;
  --bg3:#1c1c1c;
  --border:#242424;
  --border2:#303030;
  --text:#e5e5e5;
  --grey:#777;
  --grey2:#555;
  --accent:#d4a017;
  --accent2:#e8b420;
  --accent-dim:rgba(212,160,23,.12);
  --accent-ring:rgba(212,160,23,.35);
  --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}

/* ── NAV ─────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:56px;
  background:rgba(13,13,13,.97);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:0
}
.nav-back{
  display:flex;align-items:center;gap:6px;
  text-decoration:none;color:var(--grey);font-size:13px;font-weight:500;
  padding:6px 12px 6px 0;
  transition:color .15s;
  border-right:1px solid var(--border2);margin-right:16px
}
.nav-back:hover{color:var(--text)}
.nav-back svg{flex-shrink:0;opacity:.6}
.nav-brand{
  font-family:var(--font-display);font-size:15px;font-weight:700;
  letter-spacing:.01em;line-height:1;color:var(--text)
}
.nav-brand em{color:var(--accent);font-style:normal}
.nav-tag{
  margin-left:12px;
  background:var(--accent-dim);
  border:1px solid var(--accent-ring);
  color:var(--accent);
  font-family:var(--font-display);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  padding:4px 11px;border-radius:3px;
  line-height:1
}

/* ── VIEWER ─────────────────────────────── */
#viewer{
  position:fixed;top:56px;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
}

#canvas-wrap{
  flex:1;min-height:0;position:relative;overflow:hidden;
}
/* Subtle vignette overlay — frames the product shot */
#canvas-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.55) 100%);
  z-index:2
}
canvas{display:block;width:100%;height:100%;}

/* ── DIMENSION OVERLAY ─────────────────── */
#dim-overlay{
  position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .35s ease;
  z-index:3;
}
#canvas-wrap:hover #dim-overlay{ opacity:1; }

/* hide dims during floor-grid mode */
#dim-overlay.hidden{ display:none; }

.dim-line{
  stroke:#d4a017;stroke-width:1;fill:none;
  stroke-dasharray:3 3;opacity:.7;
}
.dim-line-solid{
  stroke:#d4a017;stroke-width:1;fill:none;opacity:.7;
}
.dim-cap{
  stroke:#d4a017;stroke-width:1.5;opacity:.85;
}
.dim-label{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;fill:#fff;
}
.dim-badge{
  fill:rgba(0,0,0,.72);rx:6;
}
.dim-unit{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:9px;font-weight:500;fill:#d4a017;letter-spacing:.04em;
}

/* ── PANEL ─────────────────────────────── */
#panel{
  flex-shrink:0;
  background:var(--bg2);
  border-top:1px solid var(--border);
  padding:13px 20px 15px;
  display:flex;flex-direction:column;gap:10px;
  z-index:10;
}

/* Colour row */
.panel-row{
  display:flex;align-items:center;gap:10px;
}
.p-label{
  font-family:var(--font-display);font-size:10px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--grey2);
  flex-shrink:0;min-width:52px
}
#swatches{
  display:flex;gap:6px;flex-wrap:wrap;flex:1;
}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;outline:2px solid transparent;
  transition:transform .15s,outline-color .15s,border-color .15s;
  position:relative;
}
.swatch:hover{transform:scale(1.22)}
.swatch.active{
  border-color:var(--bg2);
  outline-color:var(--accent);
  transform:scale(1.18);
}
#colour-name{
  font-family:var(--font-display);font-size:13px;font-weight:700;
  letter-spacing:.04em;color:var(--text);
  min-width:100px;text-align:right;flex-shrink:0;
  text-transform:uppercase;
}

/* Controls row */
.ctrl-row{
  display:flex;align-items:center;gap:7px;
}
.ctrl-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--grey);font-family:var(--font-display);font-size:11px;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:7px 14px;border-radius:4px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
  white-space:nowrap;line-height:1;
}
.ctrl-btn:hover{border-color:#484848;color:var(--text)}
.ctrl-btn.active{
  background:var(--accent-dim);
  border-color:rgba(212,160,23,.5);
  color:var(--accent);
}
.ctrl-spacer{flex:1}

/* ── PATTERN BUILDER PANEL ──────────────── */
#pat-controls{
  display:none;flex-direction:column;gap:9px;
  padding-top:9px;border-top:1px solid var(--border);
}
#pat-controls.visible{display:flex}
.pat-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* B-colour swatch row — smaller dots */
.b-swatch{
  width:18px;height:18px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;outline:2px solid transparent;
  transition:transform .15s,outline-color .15s,border-color .15s;
}
.b-swatch:hover{transform:scale(1.22)}
.b-swatch.active{
  border-color:var(--bg2);
  outline-color:var(--accent);
  transform:scale(1.18);
}
#pat-b-row{ align-items:center }
#pat-b-name{
  font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:.04em;color:var(--text);text-transform:uppercase;
  min-width:80px;text-align:right;flex-shrink:0;
}

/* Mini-grid paint area */
#mini-grid-wrap{display:none}
#mini-grid-wrap.visible{display:flex;flex-direction:column;gap:6px}
#mini-grid{display:grid;gap:3px;flex-shrink:0}
.mg-cell{
  width:22px;height:22px;border-radius:3px;cursor:pointer;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.06);
  transition:border-color .1s,transform .1s;
}
.mg-cell:hover{border-color:rgba(255,255,255,.35);transform:scale(1.12)}

/* Active paint-colour indicator in custom mode */
#paint-slot-row{display:flex;align-items:center;gap:6px}
.paint-slot-btn{
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;border:1.5px solid var(--border2);
  background:var(--bg3);color:var(--grey2);cursor:pointer;
  transition:all .12s;display:flex;align-items:center;gap:5px;
}
.paint-slot-btn.active{border-color:rgba(212,160,23,.6);color:var(--accent);background:var(--accent-dim)}
.paint-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}

/* Spin indicator */
#spin-dot{
  width:7px;height:7px;border-radius:50%;background:#4ade80;
  display:inline-block;margin-right:6px;
  animation:spinpulse 2s ease-in-out infinite;
}
@keyframes spinpulse{0%,100%{opacity:1}50%{opacity:.3}}
#btn-spin:not(.active) #spin-dot{background:var(--grey2);animation:none}

/* ── OVERLAY ELEMENTS ─────────────────────────── */
#hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.52);
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;padding:6px 16px;
  font-size:11px;color:var(--grey);letter-spacing:.05em;
  pointer-events:none;z-index:5;white-space:nowrap;
  transition:opacity 1s ease;
}
#hint.gone{opacity:0}

/* Colour change flash */
#colour-flash{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:transparent;
  transition:background .08s;
}

/* ── LOADER ─────────────────────────────── */
#loader{
  position:absolute;inset:0;z-index:50;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s ease
}
#loader.out{opacity:0;pointer-events:none}
.loader-ring{
  width:34px;height:34px;
  border:2.5px solid var(--border2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:ring .7s linear infinite
}
.loader-text{
  font-family:var(--font-display);font-size:11px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--grey2)
}
@keyframes ring{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ─────────────────────────────── */
@media(max-width:540px){
  .swatch{width:21px;height:21px}
  #swatches{gap:5px}
  .ctrl-btn{padding:6px 11px;font-size:11px}
  .p-label{min-width:42px;font-size:9px}
  #colour-name{font-size:13px;min-width:90px}
  .nav-tag{display:none}
  .mg-cell{width:18px;height:18px}
}
@media(max-width:380px){
  .p-label{display:none}
  .swatch{width:20px;height:20px}
}
</style>
</head>

<nav>
  <a class="nav-back" href="./index.html">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2L3.5 6L7.5 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <!-- end caps perpendicular -->

      <!-- label background -->
      <rect x="80" y="60" width="16" height="10" rx="2" fill="rgba(0,0,0,.72)"/>
      <text class="dim-label" x="88" y="67.5" text-anchor="middle">400</text>

      <!-- THICKNESS: 36mm — right edge, vertical -->

      <line class="dim-cap" x1="79" y1="76" x2="85" y2="76"/>

      <!-- label background -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════
   COLOUR CATALOGUE
═══════════════════════════════════════════ */
const COLOURS = [
  {name:'Jet Black',    hex:'#161616'},
  {name:'Charcoal',     hex:'#2e2e2e'},
  {name:'Dark Grey',    hex:'#424242'},
  {name:'Slate',        hex:'#5c5c5c'},
  {name:'Mid Grey',     hex:'#7a7a7a'},
  {name:'Light Grey',   hex:'#ababab'},
  {name:'Silver',       hex:'#c6c6c6'},
  {name:'White',        hex:'#e8e8e8'},
  {name:'Red',          hex:'#bf231a'},
  {name:'Orange',       hex:'#d45d10'},
  {name:'Gold',         hex:'#d4a017'},
  {name:'Lime',         hex:'#78b01e'},
  {name:'Forest',       hex:'#2d6e30'},
  {name:'Royal Blue',   hex:'#1a4490'},
  {name:'Teal',         hex:'#0d7070'},
];

/* ═══════════════════════════════════════════
   BUILD SWATCHES
═══════════════════════════════════════════ */
const swatchEl = document.getElementById('swatches');
COLOURS.forEach((c,i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i===0 ? ' active' : '');
  s.style.background = c.hex;
  // Light swatches need a faint inner stroke so they're visible on dark bg
  const lum = parseInt(c.hex.slice(1,3),16)*0.299 +
               parseInt(c.hex.slice(3,5),16)*0.587 +
               parseInt(c.hex.slice(5,7),16)*0.114;
  if(lum > 140) s.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,.18)';
  s.title = c.name;
  s.addEventListener('click', () => setColour(i));
  swatchEl.appendChild(s);
});

/* ═══════════════════════════════════════════
   THREE.JS RENDERER + SCENE + CAMERA
═══════════════════════════════════════════ */
const canvas   = document.getElementById('canvas');
const wrap     = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.038);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 80);

/* ═══════════════════════════════════════════
   LIGHTING — 3-POINT PRODUCT PHOTOGRAPHY
═══════════════════════════════════════════ */

// Ambient: barely-there fill so nothing is pure black
scene.add(new THREE.AmbientLight(0xffffff, 0.16));

// Key — warm white from upper-left; primary shadow caster
const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.3);
keyLight.position.set(-4, 7, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.setScalar(2048);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 26;
keyLight.shadow.camera.left = -8; keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8; keyLight.shadow.camera.bottom = -8;
keyLight.shadow.bias = -0.0008;
keyLight.shadow.radius = 5;
scene.add(keyLight);

// Fill — cool blue-white from the right; softens harsh shadows
const fillLight = new THREE.DirectionalLight(0xc4d4ff, 0.52);
fillLight.position.set(5, 3, -2);
scene.add(fillLight);

// Rim — gold tint from behind; the brand's own accent colour
// This gives tile edges a warm gold edge-light that ties into the site identity
const rimLight = new THREE.DirectionalLight(0xd4a017, 0.42);
rimLight.position.set(0.5, 2, -7);
scene.add(rimLight);

// Ground bounce — subtle upfill from below
const groundLight = new THREE.DirectionalLight(0x1a1208, 0.18);
groundLight.position.set(0, -4, 0);
scene.add(groundLight);

/* ═══════════════════════════════════════════
   GROUND PLANE (shadow receiver + depth)
═══════════════════════════════════════════ */
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({color:0x080808, roughness:0.97, metalness:0.0})
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -0.20;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

/* ═══════════════════════════════════════════
   SURFACE TEXTURE GENERATOR
   L1 (Manhattan) distance from tile centre gives TRUE
   concentric diamond (tilted-square) isocontours.
   In each quadrant ribs are parallel diagonal lines;
   adjacent quadrants are perpendicular — exactly the
   concentric diamond pattern of the real tile.
     • Flat raised border frame with chamfer
     • Concentric diamond ribs via |dx|+|dy|
     • Small drainage holes on the diagonal grid
   Per-pixel createImageData for smooth gradients.
═══════════════════════════════════════════ */
function makeTileTexture(hex) {
  const SIZE = 512;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = SIZE;
  const ctx = cvs.getContext('2d');

  const r0 = parseInt(hex.slice(1,3), 16);
  const g0 = parseInt(hex.slice(3,5), 16);
  const b0 = parseInt(hex.slice(5,7), 16);
  const lum = 0.299*r0 + 0.587*g0 + 0.114*b0;
  const bv = lum < 55 ? 2.8 : lum < 110 ? 2.0 : 1.25;

  const img = ctx.createImageData(SIZE, SIZE);
  const data = img.data;

  const BORDER = 0.055;
  // ~9 ring crests from centre to border inner edge (cardinal direction)
  const N_RINGS = 9;
  const PERIOD  = (0.5 - BORDER) / N_RINGS; // ≈ 0.0494 in normalised space
  // Drainage holes every 2 rings in the diagonal coordinate grid
  const HOLE_P  = PERIOD * 2.0;
  const HOLE_F  = 0.20;  // fraction of hole-period that is the slot

  for (let py = 0; py < SIZE; py++) {
    for (let px = 0; px < SIZE; px++) {
      const i  = (py * SIZE + px) * 4;
      const nx = px / SIZE;
      const ny = py / SIZE;

      const edgeL = nx / BORDER;
      const edgeR = (1 - nx) / BORDER;
      const edgeT = ny / BORDER;
      const edgeB = (1 - ny) / BORDER;
      const inBorder = edgeL < 1 || edgeR < 1 || edgeT < 1 || edgeB < 1;

      let h; // 0 = deepest recess, 1 = highest crest

      if (inBorder) {
        // Raised flat frame, chamfered at outer lip
        const inner = Math.min(edgeL, edgeR, edgeT, edgeB);
        h = inner < 0.18 ? 0.28 + inner * ((0.62 - 0.28) / 0.18) : 0.62;
      } else {
        const dx = nx - 0.5;
        const dy = ny - 0.5;

        // L1 (Manhattan) distance from tile centre
        // Isocontours are true tilted-square diamonds
        const l1 = Math.abs(dx) + Math.abs(dy);
        const phase = (l1 / PERIOD) % 1.0;
        // Smooth cosine rib profile: crest at phase=0, trough at phase=0.5
        const ribH = (Math.cos(phase * Math.PI * 2) + 1) * 0.5;

        // Drainage holes at intersections of the diagonal coordinate grid
        // u = dx+dy, v = dx-dy are the two 45° axes aligned with the ribs
        const u = (((dx + dy) / HOLE_P) % 1 + 1) % 1;
        const v = (((dx - dy) / HOLE_P) % 1 + 1) % 1;
        const isHole = u < HOLE_F && v < HOLE_F && l1 > PERIOD * 0.5;

        h = isHole ? 0.03 : ribH;
      }

      const boost = (h - 0.5) * 82 * bv;
      data[i]   = Math.max(0, Math.min(255, Math.round(r0 + boost)));
      data[i+1] = Math.max(0, Math.min(255, Math.round(g0 + boost)));
      data[i+2] = Math.max(0, Math.min(255, Math.round(b0 + boost)));
      data[i+3] = 255;
    }
  }

  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cvs);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

/* ═══════════════════════════════════════════
   TILE DIMENSIONS  (1 unit ≈ 10 cm)
   Real tile: 400×400×36 mm
═══════════════════════════════════════════ */
const TW=4, TH=0.36, TD=4;        // tile W, H, D
const FLOOR_GEOM = new THREE.BoxGeometry(TW, TH, TD); // shared, never disposed

/* ═══════════════════════════════════════════
   SCENE GROUPS
═══════════════════════════════════════════ */
const singleGroup = new THREE.Group();
scene.add(singleGroup);

const floorGroup  = new THREE.Group();
floorGroup.visible = false;
scene.add(floorGroup);

/* ── Resource tracking for disposal ── */
let _sTex=null, _sTop=null, _sSide=null;
let _fTex=null, _fTop=null, _fSide=null;

function makeMaterials(hex) {
  const tex = makeTileTexture(hex);
  const col = new THREE.Color(hex);
  const sideCol = col.clone().multiplyScalar(0.80);
  const topMat  = new THREE.MeshPhysicalMaterial({map:tex, roughness:0.70, metalness:0.02, reflectivity:0.07});
  const sideMat = new THREE.MeshPhysicalMaterial({color:sideCol, roughness:0.76, metalness:0.0});
  return {tex, topMat, sideMat};
}

// BoxGeometry face order: [+X, -X, +Y, -Y, +Z, -Z] = [right, left, top, bottom, front, back]
function buildSingleTile(hex) {
  // Dispose previous — handles both Mesh children and Group children
  singleGroup.children.slice().forEach(c => {
    singleGroup.remove(c);
    if(c.isGroup) {
      c.children.forEach(m => { if(m.geometry) m.geometry.dispose(); });
    } else if(c.geometry) {
      c.geometry.dispose();
    }
  });
  if(_sTex){ _sTex.dispose(); _sTop.dispose(); _sSide.dispose(); }

  const {tex,topMat,sideMat} = makeMaterials(hex);
  _sTex=tex; _sTop=topMat; _sSide=sideMat;
  const mats = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];

  // Main tile body
  const body = new THREE.Mesh(new THREE.BoxGeometry(TW, TH, TD), mats);
  body.castShadow = body.receiveShadow = true;
  singleGroup.add(body);

  /* ── Staple-shaped connector clips, all 4 edges ─────────────────
     Each clip is 3 box pieces assembled into a U / staple shape:

         ┌──┐     ┌──┐   ← two legs (arms of the staple)
         │  │     │  │
         │  │[gap]│  │
         └──┴─────┴──┘   ← crossbar (thin base, flush to tile face)
              TILE FACE

     Built in local +X space, then rotated per edge.
  ─────────────────────────────────────────────────────────────── */
  const NTABS  = 6;           // clips per edge
  const cH     = TH;          // clip height = tile thickness
  const legW   = 0.072;       // leg width along the edge
  const notch  = 0.118;       // gap between legs (the staple opening)
  const legOut = 0.108;       // leg protrusion depth beyond crossbar
  const crossD = 0.042;       // crossbar depth (thin base against tile face)

  // Adds one staple clip whose arms protrude in local +X.
  // posX/posZ place the clip anchor on the tile edge face.
  // rotY rotates the group so +X points away from the edge.
  function addStaple(posX, posZ, rotY) {
    const grp = new THREE.Group();
    grp.position.set(posX, 0, posZ);
    grp.rotation.y = rotY;

    // Left leg — starts flush at tile face, extends outward
    const ll = new THREE.Mesh(
      new THREE.BoxGeometry(legOut, cH, legW), sideMat);
    ll.position.set(legOut/2, 0, -(notch/2 + legW/2));
    ll.castShadow = true;
    grp.add(ll);

    // Right leg — starts flush at tile face, extends outward
    const rl = new THREE.Mesh(
      new THREE.BoxGeometry(legOut, cH, legW), sideMat);
    rl.position.set(legOut/2, 0, +(notch/2 + legW/2));
    rl.castShadow = true;
    grp.add(rl);

    // Crossbar — caps the outer tips of the legs
    const cb = new THREE.Mesh(
      new THREE.BoxGeometry(crossD, cH, legW*2 + notch), sideMat);
    cb.position.set(legOut + crossD/2, 0, 0);
    cb.castShadow = true;
    grp.add(cb);

    singleGroup.add(grp);
  }

  const spZ = TD / (NTABS + 1);  // clip spacing for left/right edges (along Z)
  const spX = TW / (NTABS + 1);  // clip spacing for front/back edges (along X)

  for(let i=1; i<=NTABS; i++) {
    const pz = -TD/2 + i*spZ;
    const px = -TW/2 + i*spX;
    addStaple( TW/2,   pz,  0);           // right edge  → protrudes +X
    addStaple(-TW/2,   pz,  Math.PI);     // left edge   → protrudes -X
    addStaple( px,   TD/2, -Math.PI/2);   // front edge  → protrudes +Z
    addStaple( px,  -TD/2,  Math.PI/2);   // back edge   → protrudes -Z
  }
}

/* ═══════════════════════════════════════════
   PATTERN BUILDER — state
═══════════════════════════════════════════ */
let patGridN    = 3;
let patType     = 'checker';
let patBIdx     = 2;          // COLOURS index for slot B (Dark Grey)
let patCustomMap = null;      // flat array of hex per tile, length patGridN²
let patPaintSlot = 'A';       // 'A' or 'B' — which slot the paint brush uses
let _patCache   = {};         // hex → {tex,topMat,sideMat} — reused across rebuilds

function getHexA(){ return COLOURS[activeIdx].hex; }
function getHexB(){ return COLOURS[patBIdx].hex; }

/* Generate a flat color map for preset patterns */
function genPatternMap(pattern, N, hexA, hexB) {
  const map = [];
  for(let r = 0; r < N; r++) {
    for(let c = 0; c < N; c++) {
      let useB = false;
      switch(pattern) {
        case 'checker':  useB = (r + c) % 2 !== 0; break;
        case 'stripe-h': useB = r % 2 !== 0; break;
        case 'stripe-v': useB = c % 2 !== 0; break;
        case 'border':   useB = r===0 || r===N-1 || c===0 || c===N-1; break;
        case 'diagonal': useB = Math.floor((r + c) / 2) % 2 !== 0; break;
      }
      map.push(useB ? hexB : hexA);
    }
  }
  return map;
}

/* Rebuild the 3-D floor group from a flat hex color map */
function buildPatternGrid(N, colorMap) {
  while(floorGroup.children.length) floorGroup.remove(floorGroup.children[0]);

  // Dispose cached materials whose hex is no longer needed
  const needed = new Set(colorMap);
  Object.keys(_patCache).forEach(hex => {
    if(!needed.has(hex)){
      _patCache[hex].tex.dispose();
      _patCache[hex].topMat.dispose();
      _patCache[hex].sideMat.dispose();
      delete _patCache[hex];
    }
  });

  const GAP = 0.035;
  const cx  = (N - 1) / 2;

  colorMap.forEach((hex, idx) => {
    const row = Math.floor(idx / N), col = idx % N;
    if(!_patCache[hex]) _patCache[hex] = makeMaterials(hex);
    const {topMat, sideMat} = _patCache[hex];
    const tile = new THREE.Mesh(
      FLOOR_GEOM,
      [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]
    );
    tile.position.set((col - cx) * (TW + GAP), 0, (row - cx) * (TD + GAP));
    tile.castShadow = tile.receiveShadow = true;
    floorGroup.add(tile);
  });
}

/* Master rebuild — reads current state */
function rebuildFloor() {
  const hexA = getHexA(), hexB = getHexB();
  let map;
  if(patType === 'solid')  map = Array(patGridN * patGridN).fill(hexA);
  else if(patType === 'custom') map = patCustomMap || Array(patGridN * patGridN).fill(hexA);
  else map = genPatternMap(patType, patGridN, hexA, hexB);
  buildPatternGrid(patGridN, map);
}

/* Set camera r for a given grid size */
const PAT_R_BY_N = {2:13, 3:19, 4:25, 5:31, 6:38};
function patCameraForGrid(N) {
  sphTgt.phi = 0.45;
  sphTgt.r   = PAT_R_BY_N[N] || 19;
  tgtLook.copy(LOOK_FLOOR);
}

/* ── Mini-grid (Custom mode) ─────────────── */
function renderMiniGrid() {
  const mg = document.getElementById('mini-grid');
  mg.style.gridTemplateColumns = `repeat(${patGridN}, 22px)`;
  mg.innerHTML = '';
  (patCustomMap || []).forEach((hex, idx) => {
    const cell = document.createElement('div');
    cell.className = 'mg-cell';
    cell.style.background = hex;
    cell.addEventListener('click', () => {
      const newHex = patPaintSlot === 'A' ? getHexA() : getHexB();
      patCustomMap[idx] = newHex;
      cell.style.background = newHex;
      buildPatternGrid(patGridN, patCustomMap);
    });
    mg.appendChild(cell);
  });
}

/* Initialise custom map from a preset */
function initCustomMap() {
  patCustomMap = genPatternMap('checker', patGridN, getHexA(), getHexB());
}

/* Show / hide B-row and mini-grid based on current pattern type */
function syncPatUI() {
  const bRow  = document.getElementById('pat-b-row');
  const mgWrap = document.getElementById('mini-grid-wrap');
  const isSolid  = patType === 'solid';
  const isCustom = patType === 'custom';
  bRow.style.display   = isSolid ? 'none' : '';
  mgWrap.classList.toggle('visible', isCustom);
  if(isCustom && patCustomMap) renderMiniGrid();
  // keep paint-dot colours in sync
  document.getElementById('paint-a-dot').style.background = getHexA();
  document.getElementById('paint-b-dot').style.background = getHexB();
}

/* ═══════════════════════════════════════════
   SPHERICAL CAMERA CONTROL
   theta = horizontal azimuth, phi = vertical from zenith, r = distance
═══════════════════════════════════════════ */
// Initial angle: straight-on from front, 40° above horizon
const INIT_SINGLE = {theta:0, phi:0.52, r:8.5};
const INIT_FLOOR  = {theta:0, phi:0.45, r:19.0};

const sph    = {...INIT_SINGLE};
const sphTgt = {...INIT_SINGLE};

const curLook = new THREE.Vector3(0, 0.08, 0);
const tgtLook = new THREE.Vector3(0, 0.08, 0);
const LOOK_SINGLE = new THREE.Vector3(0, 0.08, 0);
const LOOK_FLOOR  = new THREE.Vector3(0, 0, 0);

let pointerDown = false, pStart = {x:0, y:0};
let autoSpin = true;

function updateCamera() {
  if(autoSpin && !pointerDown) sphTgt.theta += 0.008;

  const L = 0.09;
  sph.theta += (sphTgt.theta - sph.theta) * L;
  sph.phi   += (sphTgt.phi   - sph.phi)   * L;
  sph.r     += (sphTgt.r     - sph.r)     * L;
  curLook.lerp(tgtLook, L);

  const sp = Math.sin(sph.phi);
  camera.position.set(
    sph.r * sp * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * sp * Math.cos(sph.theta)
  );
  camera.lookAt(curLook);
}

/* Pointer events */
canvas.addEventListener('pointerdown', e => {
  pointerDown = true;
  pStart = {x:e.clientX, y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
  hideHint();
});
canvas.addEventListener('pointermove', e => {
  if(!pointerDown) return;
  const dx = e.clientX - pStart.x, dy = e.clientY - pStart.y;
  pStart = {x:e.clientX, y:e.clientY};
  sphTgt.theta -= dx * 0.011;
  sphTgt.phi = Math.max(0.05, Math.min(1.48, sphTgt.phi + dy * 0.009));
});
canvas.addEventListener('pointerup', () => { pointerDown = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  sphTgt.r = Math.max(3.5, Math.min(22, sphTgt.r + e.deltaY * 0.018));
  hideHint();
}, {passive:false});

/* ═══════════════════════════════════════════
   VIEW MODE TOGGLE
═══════════════════════════════════════════ */
let viewMode = 'single';

function setViewMode(mode) {
  viewMode = mode;
  singleGroup.visible = mode === 'single';
  floorGroup.visible  = mode === 'floor';
  document.getElementById('btn-single').classList.toggle('active', mode==='single');
  document.getElementById('btn-floor').classList.toggle('active',  mode==='floor');
  document.getElementById('dim-overlay').classList.toggle('hidden', mode==='floor');
  document.getElementById('pat-controls').classList.toggle('visible', mode==='floor');

  if(mode === 'single') {
    sphTgt.phi = INIT_SINGLE.phi;
    sphTgt.r   = INIT_SINGLE.r;
    tgtLook.copy(LOOK_SINGLE);
  } else {
    rebuildFloor();
    patCameraForGrid(patGridN);
  }
}

document.getElementById('btn-single').addEventListener('click', () => setViewMode('single'));
document.getElementById('btn-floor').addEventListener('click',  () => setViewMode('floor'));

const spinBtn = document.getElementById('btn-spin');
spinBtn.addEventListener('click', () => {
  autoSpin = !autoSpin;
  spinBtn.classList.toggle('active', autoSpin);
});

/* ═══════════════════════════════════════════
   COLOUR CHANGE
═══════════════════════════════════════════ */
let activeIdx = 0;
const flash = document.getElementById('colour-flash');

function setColour(i) {
  if(i === activeIdx) return;
  activeIdx = i;
  document.querySelectorAll('.swatch').forEach((s,j) => s.classList.toggle('active', j===i));
  document.getElementById('colour-name').textContent = COLOURS[i].name;

  flash.style.background = 'rgba(212,160,23,.06)';
  setTimeout(() => { flash.style.background = 'transparent'; }, 120);

  buildSingleTile(COLOURS[i].hex);
  // In floor mode rebuild using the full pattern logic
  if(viewMode === 'floor') {
    // If custom map exists, refresh cells that used old hexA
    if(patType === 'custom' && patCustomMap) {
      renderMiniGrid(); // re-render so paint-a-dot updates
    }
    syncPatUI();       // update paint-dot colors
    rebuildFloor();
  }
}

/* ═══════════════════════════════════════════
   HINT DISMISS
═══════════════════════════════════════════ */
const hintEl = document.getElementById('hint');
let hintGone = false;
function hideHint() {
  if(hintGone) return;
  hintGone = true;
  hintEl.classList.add('gone');
}
setTimeout(hideHint, 5500);

/* ═══════════════════════════════════════════
   RESIZE
═══════════════════════════════════════════ */
function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);   // sets buffer; CSS width/height: 100% handles display
}
new ResizeObserver(onResize).observe(wrap);
onResize();

/* ═══════════════════════════════════════════
   PATTERN EVENT HANDLERS
═══════════════════════════════════════════ */

// Grid size buttons
document.querySelectorAll('[data-grid]').forEach(btn => {
  btn.addEventListener('click', () => {
    patGridN = parseInt(btn.dataset.grid);
    document.querySelectorAll('[data-grid]').forEach(b => b.classList.toggle('active', b===btn));
    // Reset custom map whenever grid size changes
    if(patType === 'custom') {
      initCustomMap();
      renderMiniGrid();
    }
    if(viewMode === 'floor') {
      rebuildFloor();
      patCameraForGrid(patGridN);
    }
  });
});

// Pattern type buttons
document.querySelectorAll('[data-pat]').forEach(btn => {
  btn.addEventListener('click', () => {
    patType = btn.dataset.pat;
    document.querySelectorAll('[data-pat]').forEach(b => b.classList.toggle('active', b===btn));
    if(patType === 'custom' && !patCustomMap) initCustomMap();
    syncPatUI();
    if(viewMode === 'floor') rebuildFloor();
  });
});

// B-colour swatches (generated dynamically)
const bSwatchWrap = document.getElementById('pat-b-swatches');
COLOURS.forEach((col, i) => {
  const sw = document.createElement('div');
  sw.className = 'b-swatch';
  sw.style.background = col.hex;
  sw.title = col.name;
  if(i === patBIdx) sw.classList.add('active');
  sw.addEventListener('click', () => {
    patBIdx = i;
    document.querySelectorAll('.b-swatch').forEach((s,j) => s.classList.toggle('active', j===i));
    document.getElementById('pat-b-name').textContent = COLOURS[i].name;
    document.getElementById('paint-b-dot').style.background = COLOURS[i].hex;
    if(viewMode === 'floor' && patType !== 'solid') rebuildFloor();
  });
  bSwatchWrap.appendChild(sw);
});
// Set initial B-colour name
document.getElementById('pat-b-name').textContent = COLOURS[patBIdx].name;
document.getElementById('paint-b-dot').style.background = getHexB();
document.getElementById('paint-a-dot').style.background = getHexA();

// Paint-slot A/B toggle (custom mode)
document.getElementById('paint-a-btn').addEventListener('click', () => {
  patPaintSlot = 'A';
  document.getElementById('paint-a-btn').classList.add('active');
  document.getElementById('paint-b-btn').classList.remove('active');
});
document.getElementById('paint-b-btn').addEventListener('click', () => {
  patPaintSlot = 'B';
  document.getElementById('paint-b-btn').classList.add('active');
  document.getElementById('paint-a-btn').classList.remove('active');
});

/* ═══════════════════════════════════════════
   INITIALISE + LOADER DISMISS
═══════════════════════════════════════════ */
buildSingleTile(COLOURS[0].hex);
// Initialise floor as solid so it's ready when user switches
buildPatternGrid(3, Array(9).fill(COLOURS[0].hex));

setTimeout(() => document.getElementById('loader').classList.add('out'), 420);

/* ═══════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════ */
function animate() {
  requestAnimationFrame(animate);
  updateCamera();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
